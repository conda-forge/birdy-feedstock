schema_version: 1

context:
  version: "0.10.0"

package:
  name: birdy
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/b/birdhouse-birdy/birdhouse_birdy-${{ version }}.tar.gz
  sha256: 535b64396f1f8b6d1bbdea04f9e591d5bb3e9bcf73a267e1a76ae6ed59cfe1f5

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - birdy = birdy.cli.run:cli

requirements:
  host:
    - python >=3.11.0
    - flit-core >=3.12.0,<4.0
    - pip >=25.2
  run:
    - python >=3.11.0
    - boltons >=23.0
    - click >=8.1.0
    - cryptography >=46.0.5
    - jinja2 >=3.0.0
    - lxml >=5.0.0
    - owslib >=0.19.2
    - packaging >=23.0
    - pyopenssl >=26.3.0
    - python-dateutil >=2.8.1
    - requests >=2.24.0
    - urllib3 >=2.6.0
    - wrapt >=1.14.0
  run_constrained:
    - gdal >=3.5
    - ipython >8.5.0,!=9.0.0
    - netCDF4 >=1.6.0
    - pymetalink >=6.5.3
    - xarray >=2023.1.0

tests:
  - python:
      imports:
        - birdy
      pip check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip >=25.2
        - pytest >=9.0.2
        - python ${{ python_min }}.*
        - xarray >=2023.1.0
    files:
      - pyproject.toml
      - tests
    script:
      - pip check
      - pytest -m "not online"
      - birdy --help

about:
  home: https://github.com/bird-house/birdy
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE.txt
  summary: Birdy provides a command-line tool to work with Web Processing Services (WPS).
  description: |
    Birdy is a Python command-line tool to work with Web Processing Services (WPS).
    It is built with the capabilities of OWSLib from the GeoPython project and allows
    for ease in the development of WPS-enabled services as part of the Bird-house ecosystem.
  doc_url: https://birdy.readthedocs.io/en/stable/
  dev_url: https://github.com/bird-house/birdy

extra:
  recipe-maintainers:
    - cehbrecht
    - Zeitsperre
